
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdVision Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<header class="header">
    <a href="index.html" class="logo">Ad<span>Vision</span>.</a>
    <nav>
        <a href="index.html">Saytni ko'rish</a>
    </nav>
    <span class="admin-label">ADMIN PANEL</span>
</header>

<main class="admin-container">

    <div class="admin-heading">
        <div>
            <span class="tag">BOSHQARUV MARKAZI</span>
            <h1>Admin Dashboard</h1>
            <p>Saytingizni shu yerdan boshqaring.</p>
        </div>
    </div>

    <div class="admin-stats">
        <div class="stat-card">
            <span>Jami maqolalar</span>
            <h2 id="totalArticles">0</h2>
        </div>

        <div class="stat-card">
            <span>Texnologiya</span>
            <h2 id="technologyCount">0</h2>
        </div>

        <div class="stat-card">
            <span>Biznes</span>
            <h2 id="businessCount">0</h2>
        </div>

        <div class="stat-card">
            <span>Internet</span>
            <h2 id="internetCount">0</h2>
        </div>
    </div>

    <section class="admin-form-section">

        <h2 id="formTitle">Yangi maqola qo'shish</h2>
        <p>Maqola ma'lumotlarini to'ldiring.</p>

        <form id="articleForm">

            <input type="hidden" id="articleId">

            <label>Maqola sarlavhasi</label>
            <input type="text" id="title"
                placeholder="Masalan: Sun'iy intellekt"
                required>

            <label>Kategoriya</label>
            <select id="category" required>
                <option value="Texnologiya">Texnologiya</option>
                <option value="Biznes">Biznes</option>
                <option value="Internet">Internet</option>
            </select>

            <label>Belgisi (emoji)</label>
            <input type="text" id="icon"
                placeholder="Masalan: 💻" required>

            <label>Qisqacha tavsif</label>
            <textarea id="description"
                placeholder="Maqola haqida qisqacha..."
                required></textarea>

            <label>Maqolaning to'liq matni</label>
            <textarea id="content"
                rows="8"
                placeholder="Maqolaning to'liq matnini yozing..."
                required></textarea>

            <div class="form-actions">
                <button type="submit" class="main-btn">
                    Saqlash
                </button>

                <button type="button" id="cancelEdit"
                    class="cancel-btn" hidden>
                    Bekor qilish
                </button>
            </div>

        </form>

        <p id="adminMessage"></p>
    </section>

    <section class="admin-list-section">
        <h2>Maqolalarni boshqarish</h2>
        <div id="adminArticleList"></div>
    </section>

</main>

<footer>
    <a href="index.html" class="logo">Ad<span>Vision</span>.</a>
    <p>AdVision boshqaruv paneli</p>
</footer>

<script src="data.js"></script>
<script src="admin.js"></script>

</body>
</html>
